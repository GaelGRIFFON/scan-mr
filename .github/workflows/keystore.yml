name: Générer la clé de signature

# A lancer une seule fois, a la main : onglet Actions > "Générer la clé de
# signature" > Run workflow. Le fichier produit est ensuite a deposer dans
# le depot, sous app/keystore/ambient.jks.
#
# Pourquoi ce detour : sans clé fixe, chaque build est signe par une clé
# jetable fabriquee par Gradle sur le runner, et Android refuse de mettre a
# jour une appli signee par un autre emetteur.

on:
  workflow_dispatch:
    inputs:
      motdepasse:
        description: "Mot de passe du keystore (à laisser tel quel sauf besoin particulier)"
        required: true
        default: "ambient2026"

jobs:
  cle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fabriquer le keystore
        run: |
          mkdir -p sortie
          keytool -genkeypair -v \
            -keystore sortie/ambient.jks \
            -storetype PKCS12 \
            -alias ambient \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.motdepasse }}" \
            -keypass  "${{ github.event.inputs.motdepasse }}" \
            -dname "CN=Ambient, O=Le Pas des Haies, L=Grandchamp-des-Fontaines, C=FR"

      - name: Empreinte de la clé
        run: |
          keytool -list -v \
            -keystore sortie/ambient.jks \
            -storepass "${{ github.event.inputs.motdepasse }}" \
            | grep -E "Alias|SHA256|Valid"

      - name: Rappel
        run: |
          echo "Telecharge l'artefact ci-dessous, decompresse-le, et depose"
          echo "ambient.jks dans le depot sous  app/keystore/ambient.jks"
          echo ""
          echo "Si tu as change le mot de passe par defaut, cree aussi un"
          echo "secret de depot nomme AMBIENT_KS_PASS avec cette valeur."
          echo ""
          echo "Ce workflow n'a plus a etre relance ensuite."

      - uses: actions/upload-artifact@v4
        with:
          name: ambient-keystore
          path: sortie/ambient.jks
          if-no-files-found: error
          retention-days: 7
