name: Générer la clé de signature

# À lancer une seule fois, à la main : onglet Actions > "Générer la clé de
# signature" > Run workflow. Télécharger l'artefact, décompresser, puis déposer
# scanclient.jks dans le dépôt sous  app/keystore/scanclient.jks
# (sans clé fixe, chaque build est signé par une clé jetable et Android refuse
# la mise à jour par-dessus l'app installée).

on:
  workflow_dispatch:
    inputs:
      motdepasse:
        description: "Mot de passe du keystore (laisser tel quel sauf besoin particulier)"
        required: true
        default: "scanclient2026"

jobs:
  cle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fabriquer le keystore
        env:
          KS_PASS: ${{ inputs.motdepasse }}
        run: |
          mkdir -p sortie
          keytool -genkeypair -v \
            -keystore sortie/scanclient.jks \
            -storetype PKCS12 \
            -alias scanclient \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=ScanClient, C=FR"

      - name: Empreinte de la clé
        env:
          KS_PASS: ${{ inputs.motdepasse }}
        run: |
          keytool -list -v -keystore sortie/scanclient.jks -storepass "$KS_PASS" \
            | grep -E "Alias|SHA256|Valid"
          echo ""
          echo "Si tu as changé le mot de passe par défaut, crée aussi un secret"
          echo "de dépôt SCANCLIENT_KS_PASS avec cette valeur."

      - uses: actions/upload-artifact@v4
        with:
          name: scanclient-keystore
          path: sortie/scanclient.jks
          if-no-files-found: error
          retention-days: 7
